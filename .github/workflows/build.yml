name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: create project
        run: flutter create --org com.lectures --project-name c4_schedule --platforms android .
      - name: copy files
        run: |
          cp app_pubspec.yaml pubspec.yaml
          cp main.dart lib/main.dart
          mkdir -p android/app/src/main/kotlin/com/lectures/c4_schedule
          cp MainActivity.kt android/app/src/main/kotlin/com/lectures/c4_schedule/MainActivity.kt
      - name: patch android
        run: python3 patch.py
      - name: build apk
        run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: c4-app
          path: build/app/outputs/flutter-apk/app-release.apk
