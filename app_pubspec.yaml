name: bua_schedule
description: جدول محاضرات BUA (كل الجروبات)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: 17.2.4
  timezone: 0.9.4
  shared_preferences: 2.3.3

dev_dependencies:
  flutter_launcher_icons: 0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/header.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#000C2D"
  adaptive_icon_foreground: "icon_fg.png"
